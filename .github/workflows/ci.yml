name: Security & CI Verification Pipeline

on:
  push:
    branches: [ main, master, feat/*, release/* ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  # 1. Dependency & Secret Security Scanning
  security-audit:
    name: Security Vulnerability & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Security Tools (pip-audit & bandit)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pip-audit bandit

      - name: Audit Python Dependencies for Known CVEs
        run: |
          pip-audit -r requirements.txt || true

      - name: Run Bandit Python Code Security Static Analysis (SAST)
        run: |
          bandit -r analyzer.py auth.py server.py -ll

      - name: Audit Node.js Dependencies for Vulnerabilities
        run: |
          npm audit --audit-level=high || true

  # 2. Syntax & Bytecode Compilation
  code-quality:
    name: Code Quality & Bytecode Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python Bytecode Compilation Verification
        run: |
          python3 -m compileall -q analyzer.py auth.py server.py test_analyzer.py test_auth.py

  # 3. Multi-Version Python Build & Unit Tests Matrix
  python-unit-tests:
    name: Python Build (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [code-quality, security-audit]
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Zero-Dependency Unit & Auth Tests
        run: |
          python3 test_analyzer.py
          python3 test_auth.py

  # 4. Playwright End-to-End Frontend Suite
  playwright-e2e-tests:
    name: Playwright End-to-End Test Suite
    runs-on: ubuntu-latest
    needs: [code-quality, security-audit]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Execute Playwright E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
